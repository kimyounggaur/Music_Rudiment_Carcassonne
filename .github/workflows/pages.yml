# main에 webapp이 바뀌어 올라올 때마다: 자동 테스트 → 설치형(PWA) 빌드 → gh-pages 브랜치로 배포
# 주소: https://kimyounggaur.github.io/Music_Rudiment_Carcassonne/
name: 설치형 웹앱 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: 설치
        run: npm ci

      - name: 자동 테스트
        run: npm test

      - name: 설치형 빌드
        run: npm run build:web

      - name: gh-pages 브랜치로 올리기
        working-directory: webapp/dist-web
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "배포: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
